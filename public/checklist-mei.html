<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Checklist MEI | Master Consultoria Empresarial</title>
    <meta name="theme-color" content="#04070d">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --silver-light: #f8fafc;
            --silver-main: #cbd5e1;
            --silver-dark: #94a3b8;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --text-chrome: linear-gradient(180deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
            --green: #10b981;
            --green-light: #34d399;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: #020408; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #020408, #0a1128, #050b14, #020408);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.035%22/%3E%3C/svg%3E');
            pointer-events: none; z-index: -1;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 70px 24px; }

        /* CABEÇALHO */
        .hero { text-align: center; margin-bottom: 50px; }
        .hero .tag {
            display: inline-block;
            color: var(--green-light);
            font-size: 12.5px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 5px;
            margin-bottom: 22px;
            background: rgba(16, 185, 129, 0.08);
            padding: 8px 22px; border-radius: 30px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(34px, 5vw, 52px);
            background: var(--text-chrome);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.15; margin-bottom: 16px;
        }
        .hero p { font-size: 17px; color: var(--silver-main); font-weight: 300; max-width: 640px; margin: 0 auto; }

        /* PROGRESSO */
        .progress-card {
            background: linear-gradient(145deg, rgba(15,23,42,0.5) 0%, rgba(2,4,8,0.8) 100%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 26px 30px; margin-bottom: 40px;
        }
        .progress-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .status-text { font-size: 15px; color: var(--text-dim); }
        .status-text strong { color: #fff; font-weight: 600; }
        .status-text.done strong { color: var(--green-light); }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            font: inherit; font-size: 13.5px; font-weight: 500;
            padding: 9px 18px; border-radius: 30px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary { background: var(--green); color: #04070d; border: 1px solid var(--green); }
        .btn-primary:hover { background: var(--green-light); border-color: var(--green-light); }
        .btn-ghost { background: rgba(255,255,255,0.03); color: var(--silver-main); border: 1px solid rgba(255,255,255,0.1); }
        .btn-ghost:hover { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.25); }
        .progress-bar-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #059669, #34d399); border-radius: 3px; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 0 15px rgba(16,185,129,0.6); }

        /* GRUPOS */
        .group { margin-bottom: 40px; }
        .group-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px; font-weight: 500; color: #fff;
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 18px;
        }
        .group-title::before {
            content: ''; width: 10px; height: 10px; border-radius: 50%;
            background: var(--green); box-shadow: 0 0 12px var(--green); flex-shrink: 0;
        }
        .group-title::after { content: ''; flex-grow: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent); }

        .checklist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }

        .checklist-item {
            position: relative;
            display: flex; align-items: center; gap: 16px;
            font-size: 15px; color: var(--silver-main);
            background: linear-gradient(145deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.005) 100%);
            padding: 18px 22px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer; user-select: none;
            transition: all 0.3s ease;
        }
        .checklist-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); color: #fff; }
        .checklist-item input {
            position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
        .check-box {
            width: 24px; height: 24px; flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.2); border-radius: 6px;
            background: rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .checklist-item input:checked + .check-box { background: var(--green); border-color: var(--green); box-shadow: 0 0 10px rgba(16,185,129,0.4); }
        .checklist-item input:checked + .check-box::after { content: "✓"; color: #04070d; font-weight: 900; font-size: 16px; }
        .checklist-item input:checked ~ .item-text { color: rgba(255,255,255,0.35); text-decoration: line-through; }
        .checklist-item input:focus-visible + .check-box, .btn:focus-visible { outline: 2px solid var(--green-light); outline-offset: 3px; }

        .footer {
            margin-top: 60px; padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center; font-size: 11px; color: #64748b;
            letter-spacing: 2px; text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .container { padding: 44px 16px; }
            .progress-card { padding: 22px 20px; }
            .actions { width: 100%; }
            .actions .btn { flex: 1; }
        }

        /* IMPRESSÃO / PDF */
        @media print {
            body { background: #fff; color: #000; }
            body::before, .actions, .progress-bar-track { display: none; }
            .container { padding: 0; }
            .hero .tag { background: none; border: 1px solid #000; color: #000; }
            .hero h1 { background: none; -webkit-text-fill-color: #000; color: #000; }
            .hero p, .status-text, .status-text strong, .group-title, .checklist-item, .footer { color: #000 !important; }
            .progress-card, .checklist-item { background: none; border: 1px solid #999; }
            .group-title::before { background: #000; box-shadow: none; }
            .group { break-inside: avoid; }
            .check-box { border-color: #000; background: #fff !important; box-shadow: none !important; }
            .checklist-item input:checked + .check-box::after { color: #000; }
            .checklist-item input:checked ~ .item-text { color: #000; text-decoration: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="hero">
        <div class="tag">Master Consultoria Empresarial</div>
        <h1>Checklist MEI</h1>
        <p>Dossiê de crédito institucional para Microempreendedor Individual. Marque os documentos conforme for reunindo; o progresso fica salvo neste navegador.</p>
    </header>

    <main>
        <div class="progress-card">
            <div class="progress-head">
                <p class="status-text" id="statusText" aria-live="polite"></p>
                <div class="actions">
                    <button type="button" class="btn btn-ghost" id="btnReset">↺ Limpar seleção</button>
                    <button type="button" class="btn btn-primary" onclick="window.print()">Gerar PDF</button>
                </div>
            </div>
            <div class="progress-bar-track" role="progressbar" aria-valuemin="0" aria-label="Progresso da documentação" id="progressBar">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
        </div>

        <div id="groups"></div>
    </main>

    <footer class="footer">
        Master Consultoria Empresarial • Edifício Top Tower Center, Sala 101 - Avenida do CPA. Cuiabá - MT
    </footer>
</div>

<script>
var CHECKLIST_GROUPS = [
    {
        "title": "Documentação Essencial",
        "items": [
            "CCMEI",
            "Documento Pessoal (RG ou CNH)",
            "Certidão de Casamento (se aplicável)",
            "Comprovante de Endereço",
            "Foto do Estabelecimento",
            "Acesso GOV.BR com Senha"
        ]
    }
];
var STORAGE_KEY = 'master_checklist_mei';

function loadChecked() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
}
function saveChecked(arr) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch (e) {}
}

function updateProgress() {
    var total = document.querySelectorAll('#groups input').length;
    var done  = document.querySelectorAll('#groups input:checked').length;
    var status = document.getElementById('statusText');
    status.className = 'status-text' + (done === total ? ' done' : '');
    status.innerHTML = done === total
        ? '<strong>Documentação completa ✓</strong>'
        : 'Progresso: <strong>' + done + ' de ' + total + '</strong> documentos reunidos';
    document.getElementById('progressFill').style.width = (total ? done / total * 100 : 0).toFixed(1) + '%';
    var bar = document.getElementById('progressBar');
    bar.setAttribute('aria-valuemax', total);
    bar.setAttribute('aria-valuenow', done);
}

function render() {
    var checked = loadChecked();
    var i = 0;
    document.getElementById('groups').innerHTML = CHECKLIST_GROUPS.map(function (group) {
        return '<section class="group"><h2 class="group-title">' + group.title + '</h2><div class="checklist-grid">' +
            group.items.map(function (item) {
                var idx = i++;
                return '<label class="checklist-item" for="chk' + idx + '">' +
                       '<input type="checkbox" id="chk' + idx + '" data-index="' + idx + '"' + (checked.indexOf(idx) !== -1 ? ' checked' : '') + '>' +
                       '<span class="check-box" aria-hidden="true"></span>' +
                       '<span class="item-text">' + item + '</span>' +
                       '</label>';
            }).join('') + '</div></section>';
    }).join('');
    updateProgress();
}

document.getElementById('groups').addEventListener('change', function () {
    saveChecked(Array.prototype.map.call(this.querySelectorAll('input:checked'), function (cb) {
        return parseInt(cb.dataset.index, 10);
    }));
    updateProgress();
});

document.getElementById('btnReset').addEventListener('click', function () {
    if (confirm('Deseja limpar todos os documentos marcados?')) { saveChecked([]); render(); }
});

render();
</script>

</body>
</html>
